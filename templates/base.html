<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="Discover your next favorite title with CineMatch, a machine-learning powered Netflix catalog recommender.">
  <title>{% block title %}CineMatch — Find your next favorite{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar wrap">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">C</span><span>Cine<span class="brand-accent">Match</span></span></a>
    <nav><a href="{{ url_for('home') }}#how-it-works">How it works</a><a class="nav-cta" href="{{ url_for('home') }}#discover">Discover titles <span>↗</span></a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer wrap"><a class="brand footer-brand" href="{{ url_for('home') }}"><span class="brand-mark">C</span><span>Cine<span class="brand-accent">Match</span></span></a><p>Made for curious movie and series fans. <span>Recommendations are powered by content similarity.</span></p></footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body></html>
